[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-toolkit"
version = "0.1.0"
description = "Ferramentas para validar, checar e empacotar a skill de QA cenarios-de-teste."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-html>=4.1"]
lint = ["ruff>=0.11"]
e2e = ["pytest>=8.0", "pytest-playwright>=0.5"]
dev = ["qa-toolkit[test,lint,e2e]", "build>=1.2", "pre-commit>=3.7"]

[project.scripts]
qa-toolkit = "qa_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Os testes E2E dependem do site publicado e rodam em job próprio: pytest tests/e2e
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
markers = ["e2e: testes ponta a ponta contra o relatório publicado no GitHub Pages"]

[tool.coverage.run]
source = ["qa_toolkit"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = ["raise SystemExit\\(main\\(\\)\\)"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
